[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bangla-absa-reconstruction"
version = "0.1.0"
description = "Transparent reconstruction of BanglaABSA multi-aspect sentiment experiments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "scikit-learn>=1.5,<2", "torch>=2.6,<3", "transformers>=4.40,<5", "safetensors>=0.4", "xgboost>=2.1,<4", "skops>=0.11", "matplotlib>=3.8", "sentencepiece>=0.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.9", "krippendorff>=0.8"]

[project.scripts]
bangla-absa = "bangla_absa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
