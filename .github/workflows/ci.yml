name: Offline CPU checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU dependencies and package
        run: |
          python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-lock.txt
          python -m pip install -e . --no-deps
      - name: Lint and format
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Offline tests and meaningful coverage
        run: python -m pytest --cov=bangla_absa --cov-report=term-missing --cov-fail-under=80 -q
      - name: Documented smoke command
        run: bangla-absa smoke --out runs/ci-smoke
